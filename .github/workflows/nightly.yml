name: Read the venues' calendars
on:
  schedule:
    - cron: '17 9 * * *'   # every night, about 4-5 am in the valley
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: nightly, cancel-in-progress: false }
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
      - name: Draw the day's share cards
        run: pip install -q pillow && python3 cards.py
      - name: Keep what changed
        run: |
          git config user.name "Project Scroll"; git config user.email "research@projectscroll.com"
          git add nights.json status.json games.json sports_status.json nights.ics games.ics cards/
          git diff --cached --quiet || git commit -m "Nights read $(date -u +%F)"
          git pull --rebase -q && git push
      # Facebook keeps a page's card until asked to read it again: ask it each morning for the two pages whose card changes daily.
      # Needs the repository secret FB_APP_TOKEN (the same "<app id>|<app secret>" as projectscroll's); without it, nothing happens.
      - name: Tell Facebook the cards changed
        env:
          FB: ${{ secrets.FB_APP_TOKEN }}
        run: |
          [ -n "$FB" ] || { echo "no FB_APP_TOKEN secret"; exit 0; }
          sleep 120   # raw.githubusercontent.com keeps a copy for up to five minutes
          for u in https://projectscroll.com/scroll-bar/ https://projectscroll.com/sports/; do
            curl -sS -o /dev/null -w "$u %{http_code}\n" -X POST https://graph.facebook.com/v19.0/ --data-urlencode "id=$u" -d scrape=true --data-urlencode "access_token=$FB" || true
          done
